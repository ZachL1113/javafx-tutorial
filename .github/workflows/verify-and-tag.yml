name: Verify and tag JavaFX tutorial

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/verify-and-tag.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build the application
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --console=plain

      - name: Create tutorial milestone tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag Tutorial-Part1 2e9133a6c2c80f4d8ab2b66dd6efbc3858c43f78
          git tag Tutorial-Part2 c09d512294e28bcf8d5f7f67f0885f6bb51712ed
          git tag Tutorial-Part3 36f33e5a2cf5f01ece8e99ac23f7484b4a471b4f
          git tag Tutorial-Part4 3ea74a4b6c0e2d6c4c81483321d9763bf82a3de2
          git tag Tutorial-Part5 c8c40f29761120a11691c299f557d7f367456511
          git push origin Tutorial-Part1 Tutorial-Part2 Tutorial-Part3 Tutorial-Part4 Tutorial-Part5
